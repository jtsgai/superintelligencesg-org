<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-labelledby="t"><title id="t">Nodi, the Superintelligence SG mascot: a soft plush robot whose felt-framed screen face shows a small ecosystem map</title>
