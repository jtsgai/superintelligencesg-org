name: Superintelligence SG cloud maintenance

on:
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ecosystem-maintenance
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read Commons maintenance source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: superintelligencesg.org
          persist-credentials: false
      - name: Read Navigator public references
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jtsgai/superintelligencesg-com
          path: superintelligencesg.com
          persist-credentials: false
      - name: Read Lab cited sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jtsgai/superintelligencesg-ai
          path: superintelligencesg.ai
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Restore previous state and avoid duplicate daily collection
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: node superintelligencesg.org/scripts/prepare-cloud-run.mjs
      - name: Check websites and collect public source snapshots
        id: check
        if: steps.prepare.outputs.skip_daily != 'true'
        run: node superintelligencesg.org/scripts/maintain-ecosystem.mjs
      - name: Show report
        if: always() && steps.check.outcome != 'skipped'
        run: cat Growth/operations/latest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep report and next-run state
        if: always() && steps.check.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ecosystem-maintenance-state
          path: |
            Growth/operations/latest.json
            Growth/operations/latest.md
            Growth/operations/watch-state.json
            Growth/operations/work-queue.json
          if-no-files-found: error
          retention-days: 7
