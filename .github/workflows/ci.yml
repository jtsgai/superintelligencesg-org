name: CI
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JSON schemas and data
        run: npm run validate:data
      - name: Test
        run: npm test
      - name: Test MCP connector
        working-directory: mcp
        run: npm ci && npm test
